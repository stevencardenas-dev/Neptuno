name: CD

# Despliegue continuo: cuando el CI termina en verde sobre main, la instancia de EC2
# hace `git pull` y corre ./desplegar-ec2.sh. Usa AWS Systems Manager (Run Command):
# no hace falta abrir el puerto 22 ni guardar una llave .pem.
#
# Requisitos (una sola vez):
#   - Secretos del repositorio AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY (ya existen
#     por el botón de encender/apagar). Ese usuario necesita además ssm:SendCommand,
#     ssm:GetCommandInvocation y ssm:ListCommandInvocations.
#   - La instancia aparece «Online» en Systems Manager (ya lo está).
#   - Variable del repositorio RUTA_REPO_EC2 con la carpeta del repo en la instancia
#     (opcional: si falta, se busca desplegar-ec2.sh en /home, /opt y /root).
#
# Si la instancia está apagada no se despliega: al encenderla arranca la versión
# anterior; usa «Run workflow» en este mismo flujo cuando la enciendan.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptuno-aws
  cancel-in-progress: false

jobs:
  desplegar:
    # Solo si el CI pasó (o si lo lanzan a mano).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Credenciales de AWS (vienen de los secretos del repositorio)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Buscar la instancia
        id: ec2
        run: |
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=neptuno" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId | [0]' --output text)
          estado=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "estado=$estado" >> "$GITHUB_OUTPUT"
          echo "Instancia $id: $estado"

      - name: Instancia apagada, no se despliega
        if: steps.ec2.outputs.estado != 'running'
        run: echo "::warning::La instancia está ${{ steps.ec2.outputs.estado }}. Enciéndela y relanza este flujo."

      - name: Actualizar y reconstruir en la instancia
        if: steps.ec2.outputs.estado == 'running'
        env:
          INSTANCIA: ${{ steps.ec2.outputs.id }}
          RUTA: ${{ vars.RUTA_REPO_EC2 }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          remoto='set -e
          ruta="'"$RUTA"'"
          [ -n "$ruta" ] || ruta=$(dirname "$(find /home /opt /root -maxdepth 3 -name desplegar-ec2.sh 2>/dev/null | head -1)")
          cd "$ruta"
          sudo -u "$(stat -c %U .)" bash -c "git fetch origin main && git reset --hard '"$COMMIT"' && ./desplegar-ec2.sh"'

          cmd=$(aws ssm send-command \
            --instance-ids "$INSTANCIA" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1800 \
            --parameters "$(jq -n --arg c "$remoto" '{commands: [$c]}')" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $cmd"

          # El build tarda varios minutos: se consulta hasta que termine.
          for _ in $(seq 1 90); do
            sleep 20
            estado=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCIA" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "estado: $estado"
            case "$estado" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCIA" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -n 60
          [ "$estado" = "Success" ]

      - name: Comprobar que la app responde
        if: steps.ec2.outputs.estado == 'running'
        run: ./controlar-ec2.sh estado
