name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  servicio-usuarios:
    name: servicio-usuarios (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicio-usuarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
