# Los secretos (JWT_SECRETO, CLAVE_SERVICIOS, ADMIN_CLAVE, claves de BD y broker) no
# tienen valor por defecto: sin ellos el servicio no arranca. Para desarrollo local usa
# el perfil "local" (application-local.yml): mvn spring-boot:run -Dspring-boot.run.profiles=local
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  # Confía en X-Forwarded-* solo cuando vienen de un proxy interno (nginx en la red de
  # Docker); así getRemoteAddr() devuelve la IP real del cliente y no es falsificable.
  forward-headers-strategy: native

spring:
  application:
    name: servicio-usuarios
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth_catalogs_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USUARIO:neptuno}
    password: ${DB_CLAVE}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ACTIVO:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USUARIO:neptuno}
    password: ${RABBIT_CLAVE}
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # El servicio opera aunque RabbitMQ esté caído: los eventos quedan pendientes y se
    # reintentan. Por eso solo la base de datos es crítica para el estado de salud.
    rabbit:
      enabled: ${RABBIT_HEALTH:false}

springdoc:
  swagger-ui:
    path: /api/usuarios/documentacion
  api-docs:
    path: /api/usuarios/openapi

# Parámetros propios del microservicio (ms-auth-catalogs)
neptuno:
  jwt:
    # El secreto debe tener al menos 32 caracteres (HS256). Sobrescribir en producción.
    secreto: ${JWT_SECRETO}
    emisor: ${JWT_EMISOR:neptuno-ms-auth-catalogs}
    vigencia-acceso: ${JWT_VIGENCIA:PT30M}
    vigencia-refresco: ${JWT_VIGENCIA_REFRESCO:PT12H}
  servicios:
    # Clave compartida para llamadas máquina a máquina (endpoints /interno/**)
    clave-interna: ${CLAVE_SERVICIOS}
  eventos:
    # Publica los eventos de bitácora en RabbitMQ (ms-audit-infra). Si RabbitMQ no responde,
    # el evento queda registrado en la tabla evento_auditoria y se reintenta en el siguiente arranque.
    publicar: ${PUBLICAR_EVENTOS:true}
    exchange: ${EVENTOS_EXCHANGE:neptuno.eventos}
    cola-auditoria: ${EVENTOS_COLA_AUDITORIA:audit.infrastructure}
    routing-key: ${EVENTOS_ROUTING_KEY:audit.evento}
    intervalo-publicacion: ${EVENTOS_INTERVALO:PT5S}
  cors:
    # Lista separada por comas. Solo hace falta si el navegador llama al servicio sin nginx.
    origenes: ${CORS_ORIGENES:http://localhost:5173}
  datos-iniciales:
    # Crea (una sola vez) el catálogo de permisos, los roles base, los catálogos maestros y el usuario administrador.
    activo: ${DATOS_INICIALES:true}
    administrador-nombre: ${ADMIN_NOMBRE:Administrador del sistema}
    administrador-correo: ${ADMIN_CORREO:}
    administrador-clave: ${ADMIN_CLAVE:}
